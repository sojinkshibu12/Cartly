services:
  postgres:
    image: postgres:16-alpine
    container_name: youtube-clone-postgres
    environment:
      POSTGRES_DB: youtube_clone
      POSTGRES_USER: youtube_user
      POSTGRES_PASSWORD: youtube_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youtube_user -d youtube_clone"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio
    container_name: youtube-clone-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-setup:
    image: quay.io/minio/mc
    container_name: youtube-clone-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        sleep 2;
      done;
      mc mb -p local/youtube-videos || true;
      mc anonymous set download local/youtube-videos || true;
      cat <<'EOF' > /tmp/cors.json
      [
        {
          \"AllowedOrigins\": [\"http://localhost:5173\"],
          \"AllowedMethods\": [\"GET\", \"PUT\"],
          \"AllowedHeaders\": [\"*\"],
          \"ExposeHeaders\": [\"ETag\"],
          \"MaxAgeSeconds\": 3000
        }
      ]
      EOF
      mc cors set local/youtube-videos /tmp/cors.json;
      "

volumes:
  postgres_data:
  minio_data:
