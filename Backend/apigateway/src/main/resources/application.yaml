spring:
  application:
    name: apigateway

  config:
    import: optional:configserver:http://localhost:8888

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: authservice-users
              uri: lb://AUTHSERVICE
              predicates:
                - Path=/api/users/**
            - id: productservice
              uri: lb://PRODUCTSERVICE
              predicates:
                - Path=/api/products/**


server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
